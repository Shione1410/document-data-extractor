[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-data-extractor"
version = "1.20.15"
description = "Local document data extraction and preprocessing tool for building business master data from Excel, CSV, Word, PDF, and scanned PDF files."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "AGPL-3.0-or-later"
keywords = [
    "document-extraction",
    "ocr",
    "pdf",
    "excel",
    "csv",
    "word",
    "paddleocr",
    "data-preprocessing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]

dependencies = [
    "PySide6>=6.7,<7",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "PyMuPDF>=1.24,<2",
    "paddlepaddle==3.2.0",
    "paddleocr==3.7.0",
    "paddlex[ocr]>=3.7.0,<3.8.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.22,<7",
]

[project.urls]
Repository = "https://github.com/"
Issues = "https://github.com/"

[tool.setuptools]
py-modules = ["main"]
